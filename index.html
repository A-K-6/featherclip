<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>FeatherClip</title>
  </head>
  <body>
    <main aria-label="Clipboard history">
      <div class="popup-title" data-tauri-drag-region><strong data-tauri-drag-region>Clipboard</strong><button id="close" aria-label="Close clipboard" title="Close (Esc)">×</button></div>
      <header class="search-wrap">
        <input id="search" type="search" placeholder="Search clips…" aria-label="Search clipboard history" autocomplete="off" spellcheck="false" />
        <kbd id="shortcut" hidden>⌘⇧V</kbd>
      </header>
      <div class="meta"><span id="count">0 clips</span><span id="activity">● Listening</span></div>
      <section class="history" aria-label="Recent clips">
        <div id="notice" role="status" hidden></div>
        <button id="gnome" class="setup" hidden>Enable GNOME clipboard support</button>
        <ul id="clips" aria-label="Clipboard entries"></ul>
        <div id="empty"><h2>No clips yet</h2><p>Copy some text to start.</p></div>
      </section>
      <footer>
        <button id="pause" aria-pressed="false">Pause</button>
        <button id="clear" disabled>Clear</button>
        <details id="settings">
          <summary aria-label="More options" title="More options">•••</summary>
          <div class="options">
            <label><input id="autostart" type="checkbox" /> Start at login</label>
            <button id="paste-permission" hidden>Enable direct paste…</button>
            <p>History stays in memory<br />and disappears on quit.</p>
            <button id="quit">Quit FeatherClip</button>
          </div>
        </details>
      </footer>
      <p id="paste-hint">Click to paste · Shift-click to copy</p>
    </main>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
