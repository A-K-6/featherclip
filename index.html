<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>FeatherClip</title>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="mark" aria-hidden="true">⌁</span><span>FeatherClip</span><span class="tag">LOCAL & LIGHT</span></div>
        <h1>A little room<br />for your clipboard.</h1>
        <p class="intro">Copy something. Keep it close.</p>
      </header>
      <section aria-label="Clipboard history" class="history">
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a clip…" aria-label="Search clipboard history" autocomplete="off" spellcheck="false" /><kbd id="shortcut">⌘⇧V</kbd></div>
        <div class="section-label"><span>RECENT CLIPS <span id="count">0 / 30</span></span><span id="activity">● Listening</span></div>
        <div id="notice" role="status" hidden></div>
        <button id="gnome" class="setup" hidden>Enable GNOME clipboard support</button>
        <div id="clips" role="list" aria-label="Recent clips"></div>
        <div id="empty"><span aria-hidden="true">⎘</span><h2>Your next copy starts here.</h2><p>Copy some text in any app.<br />Your last 30 clips will appear here.</p></div>
      </section>
      <footer>
        <div class="actions"><button id="pause" aria-pressed="false">Pause</button><button id="clear" disabled>Clear all</button><label><input id="autostart" type="checkbox" /> Start at login</label><button id="quit">Quit</button></div>
        <p><span id="paste-hint">Select a clip, then ⌘V to paste.</span><span>Memory only. Gone when you quit.</span></p>
      </footer>
    </main>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
