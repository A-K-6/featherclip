[package]
name = "featherclip"
version = "2.0.1"
description = "A tiny native clipboard popup for Ubuntu"
authors = ["Aeen Karimian <aeenakrimian@gmail.com>"]
license = "MIT"
repository = "https://github.com/A-K-6/featherclip"
edition = "2021"
rust-version = "1.90"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
x11rb = { version = "0.13", features = ["xtest", "xfixes"] }
global-hotkey = "0.8"
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
