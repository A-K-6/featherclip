version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /linux
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gtk-bindings:
        patterns: [gtk4, libadwaita, glib, gio]
