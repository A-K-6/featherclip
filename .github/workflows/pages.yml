name: Publish website
on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/featherclip.svg
      - scripts/build-site.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - assets/featherclip.svg
      - scripts/build-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/A-K-6/featherclip/releases/latest > "$RUNNER_TEMP/release.json"
      - run: python3 scripts/build-site.py --release-json "$RUNNER_TEMP/release.json"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
