name: Build and check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Repository metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-repo.py
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
  macos:
    needs: metadata
    name: macOS ${{ matrix.arch }} native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - run: swift format lint --strict --recursive macos
      - run: swift test --package-path macos
      - run: bash scripts/build-macos.sh ${{ matrix.arch }} --dmg
      - run: build/macos-${{ matrix.arch }}/FeatherClip.app/Contents/MacOS/FeatherClip --smoke-test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: featherclip-macos-${{ matrix.arch }}
          path: build/macos-${{ matrix.arch }}/*.dmg
          if-no-files-found: error
  linux:
    needs: metadata
    name: Ubuntu amd64 native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: linux
      - name: Native Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential pkg-config xvfb dbus-x11 gnome-shell openbox python3-gi gir1.2-gtk-3.0 shellcheck
      - run: shellcheck scripts/*.sh
      - run: cargo fmt --manifest-path linux/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path linux/Cargo.toml
      - name: X11 clipboard round trip
        run: dbus-run-session -- xvfb-run -a env FEATHERCLIP_ISOLATED_DISPLAY=1 cargo test --locked --manifest-path linux/Cargo.toml isolated_x11_clipboard_roundtrip -- --ignored --test-threads=1
      - run: cargo clippy --locked --manifest-path linux/Cargo.toml --all-targets -- -D warnings
      - name: X11 previous-window paste
        run: dbus-run-session -- xvfb-run -a bash scripts/test-x11-paste.sh
      - name: GNOME Wayland clipboard and previous-window paste
        run: dbus-run-session -- bash scripts/test-gnome.sh
      - run: bash scripts/build-linux.sh
      - name: Install the Ubuntu package
        run: sudo apt-get install -y ./build/linux-amd64/*.deb
      - name: Native GTK installed-app smoke check
        run: dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo GDK_BACKEND=x11 /usr/bin/featherclip --smoke-test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: featherclip-linux-amd64
          path: build/linux-amd64/*.deb
          if-no-files-found: error
  release:
    name: Publish versioned installers
    needs: [macos, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: featherclip-*
          merge-multiple: true
          path: release
      - name: Validate assets and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "release/FeatherClip_${version}_arm64.dmg"
          test -f "release/FeatherClip_${version}_x86_64.dmg"
          test -f "release/FeatherClip_${version}_amd64.deb"
          (cd release && sha256sum FeatherClip_*.dmg FeatherClip_*.deb > SHA256SUMS)
          python3 scripts/check-repo.py --release-notes > release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.deb release/SHA256SUMS \
            --verify-tag --latest --title "FeatherClip $(cat VERSION)" --notes-file release-notes.md
