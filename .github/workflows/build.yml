name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
          - name: Ubuntu amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Isolated Linux clipboard integration
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a env FEATHERCLIP_ISOLATED_DISPLAY=1 cargo test --locked --manifest-path src-tauri/Cargo.toml isolated_x11_clipboard_roundtrip -- --ignored --test-threads=1
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Package
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: macOS app smoke check
        if: runner.os == 'macOS'
        run: src-tauri/target/universal-apple-darwin/release/bundle/macos/FeatherClip.app/Contents/MacOS/featherclip --smoke-test
      - name: Linux app smoke check
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 src-tauri/target/x86_64-unknown-linux-gnu/release/featherclip --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: featherclip-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
