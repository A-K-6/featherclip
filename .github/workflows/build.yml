name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS ${{ matrix.arch }} native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test --package-path macos
      - run: bash scripts/build-macos.sh ${{ matrix.arch }} --dmg
      - run: build/macos-${{ matrix.arch }}/FeatherClip.app/Contents/MacOS/FeatherClip --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: featherclip-macos-${{ matrix.arch }}
          path: build/macos-${{ matrix.arch }}/*.dmg
          if-no-files-found: error
  linux:
    name: Ubuntu amd64 native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Native Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential pkg-config xvfb dbus-x11 gnome-shell openbox python3-gi gir1.2-gtk-3.0
      - run: cargo fmt --manifest-path linux/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path linux/Cargo.toml
      - name: X11 clipboard round trip
        run: dbus-run-session -- xvfb-run -a env FEATHERCLIP_ISOLATED_DISPLAY=1 cargo test --locked --manifest-path linux/Cargo.toml isolated_x11_clipboard_roundtrip -- --ignored --test-threads=1
      - run: cargo clippy --locked --manifest-path linux/Cargo.toml --all-targets -- -D warnings
      - name: X11 previous-window paste
        run: dbus-run-session -- xvfb-run -a bash scripts/test-x11-paste.sh
      - name: GNOME Wayland clipboard and previous-window paste
        run: dbus-run-session -- bash scripts/test-gnome.sh
      - run: bash scripts/build-linux.sh
      - name: Native GTK smoke check
        run: dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo GDK_BACKEND=x11 linux/target/release/featherclip --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: featherclip-linux-amd64
          path: build/linux-amd64/*.deb
          if-no-files-found: error
