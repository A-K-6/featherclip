[package]
name = "featherclip"
version = "1.1.0"
description = "A tiny, local clipboard history for macOS and Ubuntu"
authors = ["Aeen Karimian <aeenakrimian@gmail.com>"]
license = "MIT"
repository = "https://github.com/A-K-6/featherclip"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSWindow", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSDate", "NSNotification", "NSOperation", "block2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "libc"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
gio = "0.18"
glib = "0.18"
x11rb = { version = "0.13", features = ["xtest"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
